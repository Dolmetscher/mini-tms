name: desktop-builds

# Сборка десктопных приложений: Windows (exe/msi), Linux (AppImage/deb),
# macOS (universal dmg — Intel + Apple Silicon).
# Запуск: вручную (Actions → Run workflow) или пушем тега v*.
# При сборке из тега бандлы дополнительно прикладываются к GitHub Release тега
# (раздел Releases репозитория — постоянные ссылки на свежие установщики).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build web client
        working-directory: web
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Build desktop app
        working-directory: desktop
        run: |
          npm install --no-fund --no-audit
          npx tauri build ${{ matrix.args }}

      # Бандлы лежат по-разному: target/release/bundle и (для --target
      # universal-apple-darwin) target/universal-apple-darwin/release/bundle.
      # Собираем их в один плоский каталог — удобно и для артефактов, и для Release.
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p bundles
          find desktop/src-tauri/target -type f -path '*/bundle/*' \
            ! -path '*.app/*' -exec cp {} bundles/ \;
          ls -la bundles/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mini-tms-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: bundles/

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Mini-TMS CAT ${{ github.ref_name }}" --generate-notes || true
          shopt -s nullglob
          gh release upload "${{ github.ref_name }}" bundles/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
